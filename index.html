<script>
function searchPlaces() {
  const query = document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const sections = document.querySelectorAll(".recommendations");

  sections.forEach(section => {
    const heading = section.querySelector("h2, h3");
    const category = heading ? heading.innerText.toLowerCase() : "";

    const cards = section.querySelectorAll(".card");

    const categoryMatch = category.includes(query);

    let visibleCount = 0;

    cards.forEach(card => {
      const content = card.innerText.toLowerCase();

      if (categoryMatch || content.includes(query)) {
        card.style.display = "block";
        visibleCount++;
      } else {
        card.style.display = "none";
      }
    });

    section.style.display = visibleCount > 0 ? "block" : "none";
  });
}

function clearSearch() {
  document.getElementById("searchInput").value = "";

  document.querySelectorAll(".card").forEach(card => {
    card.style.display = "block";
  });

  document.querySelectorAll(".recommendations").forEach(section => {
    section.style.display = "block";
  });
}
</script>
