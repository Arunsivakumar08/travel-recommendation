<script>
function searchPlaces() {
  const query = document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const cards = document.querySelectorAll(".card");
  const sections = document.querySelectorAll(".recommendations");

  if (query === "") {
    cards.forEach(card => card.style.display = "block");
    sections.forEach(section => section.style.display = "block");
    return;
  }

  cards.forEach(card => {
    const content = card.innerText.toLowerCase();
    card.style.display = content.includes(query) ? "block" : "none";
  });

  sections.forEach(section => {
    const visibleCards = Array.from(
      section.querySelectorAll(".card")
    ).some(card => card.style.display !== "none");

    section.style.display = visibleCards ? "block" : "none";
  });
}

function clearSearch() {
  document.getElementById("searchInput").value = "";

  document.querySelectorAll(".card").forEach(card => {
    card.style.display = "block";
  });

  document.querySelectorAll(".recommendations").forEach(section => {
    section.style.display = "block";
  });
}
</script>
